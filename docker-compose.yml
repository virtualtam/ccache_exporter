---
networks:
  prometheus: {}

volumes:
  grafana-data: {}
  prometheus-data: {}

services:
  ccache-exporter:
    image: ghcr.io/virtualtam/ccache_exporter:latest
    build: .
    networks:
      prometheus:
    ports:
      - "19508:9508"
    volumes:
      - ${HOME}/.ccache:/var/lib/exporter/.ccache:ro

  grafana:
    image: grafana/grafana:13.3.1
    depends_on:
      - prometheus
    networks:
      prometheus:
    ports:
      - "13000:3000"
    environment:
      # Grant the Admin role to anonymous users.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"

      # Use the Grafana image renderer to render the example ccache dashboard as a PNG.
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_RENDERING_RENDERER_TOKEN: ccache-exporter-demo
    volumes:
      - ./docker/grafana-datasources.yml:/etc/grafana/provisioning/datasources/all.yml
      - ./docker/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/all.yml
      - ./docker/dashboards:/opt/dashboards
      - grafana-data:/var/lib/grafana

  node-exporter:
    image: prom/node-exporter:v1.12.1
    networks:
      prometheus:
    pid: 'host'
    ports:
      - "19100:9100"
    cap_add:
      - SYS_TIME
    # Note: We do not enable mount propagation for /proc and /sys; this allows running the example stack with
    #       Docker Desktop, where mount propagation is not available.
    #
    # See:
    # - https://docs.docker.com/engine/storage/bind-mounts/#configure-bind-propagation
    # - https://github.com/prometheus/node_exporter/issues/1509
    volumes:
      - "/proc:/host/proc:ro"
      - "/sys:/host/sys:ro"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'

  prometheus:
    image: prom/prometheus:v3.16.0
    networks:
      prometheus:
    ports:
      - "19090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

  # Use the Grafana image renderer to render the example ccache dashboard as a PNG.
  # The renderer is only started when needed.
  renderer:
    image: grafana/grafana-image-renderer:v5.12.11
    profiles:
      - screenshot
    networks:
      prometheus:
    environment:
      AUTH_TOKEN: ccache-exporter-demo
